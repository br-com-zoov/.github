name: Dependency review

# Bloqueia PRs que introduzem dependências com vulnerabilidade conhecida ou
# licença incompatível. Requer que o Dependency Graph esteja habilitado.

on:
  pull_request:

permissions:
  contents: read

jobs:
  revisar:
    name: Revisar dependências
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, GPL-3.0
